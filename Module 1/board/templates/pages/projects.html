{% extends "base.html" %}

{% block content %}
<h2>My Projects</h2>
<p class="subtitle">A complete portfolio of work from the JHU Python course</p>

<div class="projects-grid">
    {% for project in projects %}
    <div class="project-card">
        <h3>{{ project.title }}</h3>
        <p class="project-overview">{{ project.overview }}</p>
        <p><strong>What I learned:</strong> {{ project.learning }}</p>
        <a href="{{ project.folder_link }}" target="_blank" class="github-link">View on GitHub →</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
