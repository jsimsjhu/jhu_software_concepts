version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gradcafe_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gradcafe_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gradcafe_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gradcafe_network

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: gradcafe_web
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src/data:/app/data
    networks:
      - gradcafe_network

  worker:
    build:
      context: ./src/worker
      dockerfile: Dockerfile
    container_name: gradcafe_worker
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src/data:/app/data
    networks:
      - gradcafe_network

volumes:
  postgres_data:

networks:
  gradcafe_network:
    driver: bridge